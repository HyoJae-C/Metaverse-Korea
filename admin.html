<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Live players · Another Seoul</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root { color-scheme: light; --bg: #f3ecdc; --panel: #fffdf7; --ink: #2b2620; --muted: #7a7064; --line: #e2d6c2; --street: #18a058; --shop: #8a4fff; --accent: #2f6fde; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; }
      #count { font-weight: 700; color: var(--street); }
      #status { color: var(--muted); font-size: 12px; margin-left: auto; }
      select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
      main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
      #map { position: relative; min-height: 0; touch-action: none; cursor: grab; }
      #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
      aside table { width: 100%; border-collapse: collapse; }
      aside th, aside td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      aside th { position: sticky; top: 0; background: var(--panel); font-size: 12px; color: var(--muted); font-weight: 600; }
      aside tr.p { cursor: pointer; }
      aside td:first-child { white-space: nowrap; }
      aside tr.p:hover, aside tr.p.sel { background: #f1ebff; }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
      .muted { color: var(--muted); font-size: 12px; }
      #msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
      #msg > div { max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
      #msg h2 { margin: 0 0 8px; font-size: 17px; }
      #msg code { background: #f3ecdc; padding: 1px 5px; border-radius: 5px; word-break: break-all; }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
        aside { border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛡️ Live players</h1>
      <span><span id="count">–</span> <span id="countLabel">online</span></span>
      <label class="muted">Show
        <select id="within">
          <option value="90">online now</option>
          <option value="900">last 15 min</option>
          <option value="3600">last hour</option>
          <option value="86400">last 24 h</option>
        </select>
      </label>
      <button id="fit" type="button">Fit all</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="map"><canvas id="cv"></canvas><div id="msg" hidden></div></div>
      <aside>
        <table>
          <thead><tr><th>Player</th><th>Where</th><th>Seen</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </aside>
    </main>
    <script type="module" src="/src/admin/admin.js"></script>
  </body>
</html>
