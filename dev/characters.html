<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Character lineup</title>
<style>html,body{margin:0;height:100%;background:#fff8ec}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createCharacter, OUTFITS } from '../src/core/character.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1dc);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9d6b8, 1.5), new THREE.AmbientLight(0xfff0e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(3, 6, 5); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xbfe3a8 }));
scene.add(ground);
const chars = OUTFITS.map((_, i) => {
  const c = createCharacter(i);
  c.root.position.set((i - (OUTFITS.length - 1) / 2) * 0.95, 0, (i % 2) * -0.4);
  scene.add(c.root);
  return c;
});
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 2.2, 8); camera.lookAt(0, 0.6, 0);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const t = new THREE.Timer();
if (new URLSearchParams(location.search).has('wave')) chars.forEach((c, i) => i % 3 === 0 && c.wave());
renderer.setAnimationLoop(() => { t.update(); const dt = t.getDelta(); chars.forEach((c, i) => c.animate(dt, i % 4 === 1 ? 0.5 : 0)); renderer.render(scene, camera); });
</script></body></html>
