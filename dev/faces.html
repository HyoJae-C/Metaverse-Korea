<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Faces across outfits</title>
<style>html,body{margin:0;height:100%;background:#fff8ec;font:12px sans-serif}canvas{display:block;width:100%;height:100%}
.l{position:absolute;transform:translateX(-50%);background:#fffd;padding:1px 4px;border-radius:4px}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// One look in every outfit, close up, to check the face never changes
// when clothes go on (columns) with salon and clinic changes (rows).
//   ?models=basic,knight  ?rows=plain,hair,eyes,lip,all  ?style=bob  ?yaw=0.5
import * as THREE from 'three';
import { createCharacter } from '../src/core/character.js';
const q = new URLSearchParams(location.search);
const models = q.get('models')?.split(',') || ['basic', 'hoodie-black', 'puffer-black', 'padding-white', 'jacket-black', 'shirt-white', 'hanbok-pink', 'barbarian'];
const ROWS = { plain: {}, hair: { hairStyle: q.get('style') || 'bob' }, eyes: { eyeShape: 'cat', eyes: 'blue' }, lip: { lip: 'coral' }, all: { hairStyle: q.get('style') || 'bob', eyeShape: 'big', dye: 'pink', tone: 'tan', lip: 'coral' } };
const rows = q.get('rows')?.split(',') || Object.keys(ROWS);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1dc);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9d6b8, 1.5), new THREE.AmbientLight(0xfff0e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(3, 6, 5); scene.add(sun);
const GX = 0.75, GY = 0.75;
const chars = [];
rows.forEach((r, j) => models.forEach((m, i) => {
  const c = createCharacter({ model: m, hair: 'espresso', shirt: 'coral', pants: 'denim', skin: 'fair', head: q.get('head') || null, ...ROWS[r] });
  const x = (i - (models.length - 1) / 2) * GX, y = -j * GY;
  const pivot = new THREE.Group();
  pivot.position.set(x, y, 0);
  pivot.rotation.y = +(q.get('yaw') || 0);
  pivot.add(c.root);
  scene.add(pivot);
  c.label = j === 0 ? m : i === 0 ? r : '';
  c.at = new THREE.Vector3(x, y + (j === 0 ? 1.62 : 0.95), 0);
  chars.push(c);
}));
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const midY = 1.25 - ((rows.length - 1) * GY) / 2;
camera.position.set(0, midY + 0.1, 0.5 + Math.max(models.length * GX * 1.0, rows.length * GY * 1.9)); camera.lookAt(0, midY, 0);
const labels = chars.map((c) => { const d = document.createElement('div'); d.className = 'l'; d.textContent = c.label; if (!c.label) d.style.display = 'none'; document.body.append(d); return d; });
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const t = new THREE.Timer();
renderer.setAnimationLoop(() => {
  t.update(); const dt = t.getDelta();
  chars.forEach((c, i) => {
    c.animate(dt, 0);
    const p = c.at.clone().project(camera);
    labels[i].style.left = ((p.x + 1) / 2) * innerWidth + 'px';
    labels[i].style.top = ((1 - p.y) / 2) * innerHeight + 'px';
  });
  renderer.render(scene, camera);
});
</script></body></html>
