<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Heron poses</title>
<style>html,body{margin:0;height:100%;background:#dfeef2}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// The Cheonggyecheon heron (src/core/heron.js) in its poses, side by side:
// standing, stabbing at a fish, wading, taking off, flying (wings up, wings
// down) and landing. ?yaw=radians turns them all.
import * as THREE from 'three';
import { makeHeron, poseHeron } from '../src/core/heron.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfeef2);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x9db3a8, 1.6), new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.5); sun.position.set(3, 6, 5); scene.add(sun);
const water = new THREE.Mesh(new THREE.PlaneGeometry(40, 8), new THREE.MeshLambertMaterial({ color: 0x6fb7d6 }));
water.rotation.x = -Math.PI / 2; scene.add(water);
const yaw = +(q.get('yaw') ?? 0.5);
const poses = [
  { state: 'stand', strike: -1, since: 5, until: 20 },
  { state: 'stand', strike: 0.4, since: 5, until: 20 },
  { state: 'wade', strike: -1, since: 0.4, until: 20 },
  { state: 'fly', pitch: 0.3, roll: 0, since: 0.5, until: 10, y: 0.6, t: 0.15 },
  { state: 'fly', pitch: 0, roll: 0, since: 5, until: 10, y: 1.4, t: 0.3 },
  { state: 'fly', pitch: 0, roll: 0.4, since: 5, until: 10, y: 1.4, t: 0.9 },
  { state: 'fly', pitch: -0.1, roll: 0, since: 9, until: 0.6, y: 0.4, t: 0.5 },
];
poses.forEach((p, i) => {
  const m = makeHeron();
  scene.add(m);
  poseHeron(m, { u: (i - 3) * 2.4, y: p.y || 0, v: 0, yaw, ...p }, p.t ?? 0);
});
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 2.4, 13); camera.lookAt(0, 0.9, 0);
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}
addEventListener('resize', frame); frame();
window.__ready = true;
</script>
</body>
</html>
