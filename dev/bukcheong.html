<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Bukcheong lion dance</title>
<style>html,body{margin:0;height:100%;background:#fff8ec}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Preview of the Bukcheong lion dance troupe (core/bukcheong.js).
// ?t=36 jumps to that second of the round; ?view=front|top|lion.
import * as THREE from 'three';
import { BukcheongTroupe, makeShaggyLion, poseLion } from '../src/core/bukcheong.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9f2);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9c2b0, 1.5), new THREE.AmbientLight(0xfff0e0, 0.8));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(-4, 8, 3); scene.add(sun);
scene.add(new THREE.Mesh(new THREE.CircleGeometry(20, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd9d2c4 })));
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const view = q.get('view') || 'front';
let troupe = null, lion = null;
if (view === 'lion') {
  lion = makeShaggyLion(7); lion.rotation.y = -0.7; scene.add(lion);
  camera.position.set(-6, 2.6, 4); camera.lookAt(0, 1.3, -0.3);
} else {
  troupe = new BukcheongTroupe(scene, [0, 0]);
  if (view === 'band') { camera.position.set(4.6, 1.4, -5.5); camera.lookAt(7.4, 0.6, 0); }
  else if (view === 'cast') { camera.position.set(-9, 1.8, 0.01); camera.lookAt(-3, 0.7, 0); }
  else if (view === 'top') { camera.position.set(-10, 18, 0.01); camera.lookAt(1.5, 0, 0); }
  else { camera.position.set(-15, 4.5, 0); camera.lookAt(1.5, 0.8, 0); }
}
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const me = { x: -6, z: 0 };
const skip = +(q.get('t') || 0);
if (troupe) for (let s = 0; s < skip; s += 1 / 30) troupe.update(1 / 30, me);
const rear = +(q.get('rear') || 0), down = +(q.get('down') || 0);
let t = 0, last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (troupe) troupe.update(dt, me);
  if (lion) poseLion(lion, { rear, down, t });
  renderer.render(scene, camera);
});
window.__troupe = troupe;
</script></body></html>
