<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Cheonggyecheon</title>
<style>html,body{margin:0;height:100%;background:#cfe6f2}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Cheonggyecheon on its own (src/core/stream.js and lanterns.js), without
// the rest of the city, to look at the lantern festival from any spot.
// Camera in the stream's frame (u along it, v across, y up from the street):
//   ?u=20&v=6&y=-2.5&lu=60&lv=0&ly=-3   (eye, then the point it looks at)
import * as THREE from 'three';
import { buildStreams } from '../src/core/stream.js';
const q = new URLSearchParams(location.search), n = (k, d) => +(q.get(k) ?? d);
const g = await (await fetch('/regions/seongsu/districts/gyeongbokgung.json')).json();
const s = { ...g.streams[0], at: [0, 0] };
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f2);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xb7c4a8, 1.5), new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.6); sun.position.set(-30, 60, 40); scene.add(sun);
for (const sd of [-1, 1]) { // the street on both sides
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(s.len + 80, 40), new THREE.MeshLambertMaterial({ color: 0xd8d2c4 }));
  gr.rotation.x = -Math.PI / 2; gr.position.set(s.len / 2, 0, sd * (s.w / 2 + 20)); scene.add(gr);
}
const streams = buildStreams([s], scene);
const camera = new THREE.PerspectiveCamera(n('fov', 55), 1, 0.1, 1000);
camera.position.set(n('u', 20), n('y', -2.5), n('v', 6));
camera.lookAt(n('lu', 60), n('ly', -3), n('lv', 0));
const t0 = n('t', Date.now() / 1000), p0 = performance.now();
if (q.has('t')) Date.now = () => (t0 + (performance.now() - p0) / 1000) * 1000;
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  streams.userData.tick(performance.now() / 1000);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
setTimeout(() => { window.__ready = true; }, 800);
</script>
</body>
</html>
