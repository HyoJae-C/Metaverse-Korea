<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Pungmul troupe</title>
<style>html,body{margin:0;height:100%;background:#fff8ec}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:10px;top:10px;font:13px sans-serif;background:#fffc;padding:4px 8px;border-radius:8px}</style></head>
<body><canvas id="c"></canvas><div id="info"></div>
<script type="module">
// Dev preview of the pungmul troupe (core/pungmul.js) on a plain plaza.
// ?t=seconds into the routine, ?cam=x,y,z camera, ?look=x,y,z target,
// ?close=role  stand one of each part in a row to look at the props.
import * as THREE from 'three';
import { PungmulTroupe, TROUPE, routinePart } from '../src/core/pungmul.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcecf7);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9d6b8, 1.5), new THREE.AmbientLight(0xfff0e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(30, 60, 50); scene.add(sun);
scene.add(new THREE.Mesh(new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd9d2c4 })));
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const [cx, cy, cz] = (q.get('cam') || '0,26,44').split(',').map(Number);
const [lx, ly, lz] = (q.get('look') || '0,0,0').split(',').map(Number);
camera.position.set(cx, cy, cz); camera.lookAt(lx, ly, lz);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const troupe = new PungmulTroupe(scene, [0, 0]);
troupe.t = +(q.get('t') || 0);
const me = { x: 0, z: 30 };
window.__pm = troupe;
const timer = new THREE.Timer();
const info = document.getElementById('info');
renderer.setAnimationLoop(() => {
  timer.update();
  const dt = Math.min(0.1, timer.getDelta());
  camera.updateMatrixWorld();
  if (q.has('line') && troupe.people?.length === TROUPE.length) {
    // one of each part in a row, facing the camera
    const pick = TROUPE.map((w, i) => i).filter((i, j, a) => j === 0 || TROUPE[i].role !== TROUPE[a[j - 1]].role || (TROUPE[i].role === 'horn') || (TROUPE[i].role === 'japsaek'));
    troupe.people.forEach((p, i) => { p.ch.root.visible = pick.includes(i); });
    pick.forEach((i, j) => { const p = troupe.people[i]; p.ch.root.position.set((j - (pick.length - 1) / 2) * 1.5, 0, 0); p.ch.root.rotation.y = +(q.get('ry') || 0); p.ch.animate(dt, 0); });
  } else { const t0 = performance.now(); troupe.update(dt, me, camera); window.__ms = (window.__ms || 0) * 0.95 + (performance.now() - t0) * 0.05; }
  info.textContent = `${routinePart(troupe.t).part} ${troupe.t.toFixed(1)}s · ${troupe.people?.length || 0}/${TROUPE.length} · calls ${renderer.info.render.calls} · update ${(window.__ms || 0).toFixed(2)} ms`;
  renderer.render(scene, camera);
});
</script></body></html>
