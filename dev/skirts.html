<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Skirts</title>
<style>html,body{margin:0;height:100%;background:#fff8ec}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createCharacter } from '../src/core/character.js';
import { DEFAULT_LOOK } from '../src/data/appearance.js';
const q = new URLSearchParams(location.search);
const list = (q.get('s') || 'pleats-mini-navy,tartan-mini-red,dots-long-navy,floral-long-butter,denim-mini-light,stripe-long-black,leopard-mini,gingham-long-butter').split(',');
const models = (q.get('m') || 'basic,hooded,rogue,knight,mage,barbarian,ranger,basic').split(',');
const mode = q.get('mode') || 'idle';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1dc);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9d6b8, 1.5), new THREE.AmbientLight(0xfff0e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(3, 6, 5); scene.add(sun);
const chars = list.map((s, i) => {
  const c = createCharacter({ ...DEFAULT_LOOK, model: models[i % models.length], shirt: 'cream', skirt: s, skin: 'fair', hair: 'espresso', hairStyle: 'long' });
  c.root.position.set((i - (list.length - 1) / 2) * 0.95, 0, 0);
  if (q.has('turn')) c.root.rotation.y = Number(q.get('turn'));
  scene.add(c.root);
  return c;
});
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, Number(q.get('cy') || 1.4), Number(q.get('cz') || 9)); camera.lookAt(0, 0.6, 0);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
let t0 = performance.now();
renderer.setAnimationLoop(() => { const now = performance.now(); const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; chars.forEach((c) => c.animate(dt, mode === 'walk' ? 0.5 : mode === 'run' ? 1 : 0, mode === 'sit')); renderer.render(scene, camera); });
</script></body></html>
