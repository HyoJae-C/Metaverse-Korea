<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Ride motion</title>
<style>html,body{margin:0;height:100%;background:#fff8ec}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Side view of the kick scooter and inline skates in motion.
// ?speed=0..1  ?view=side|front  window.__step(seconds) advances time by hand.
import * as THREE from 'three';
import { createCharacter } from '../src/core/character.js';
import { randomLook } from '../src/data/appearance.js';
const q = new URLSearchParams(location.search);
const speed = +(q.get('speed') ?? 1);
const ALL = [
  { type: 'kick', tier: 0, color: '#3fb59a', pattern: null },
  { type: 'kick', tier: 2, color: '#ff7a00', pattern: null },
  { type: 'inline', tier: 0, color: '#5a7bd8', pattern: null },
  { type: 'inline', tier: 2, color: '#e0607e', pattern: null },
  { type: 'skate', tier: 0, color: '#8a5ad8', pattern: null },
  { type: 'skate', tier: 2, color: '#ffd93d', pattern: null },
  { type: 'bike', tier: 0, color: '#3fb59a', pattern: null },
];
const RIDES = q.has('only') ? [ALL[+q.get('only')]] : ALL; // ?only=N: one ride, close up
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1dc);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xc9d6b8, 1.5), new THREE.AmbientLight(0xfff0e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4); sun.position.set(3, 6, 5); scene.add(sun);
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xbfe3a8 })));
// A walkway at the height the town draws them (world.js ROAD_Y.walk).
const walk = new THREE.Mesh(new THREE.PlaneGeometry(30, 1.6).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd8cfc0 }));
walk.position.y = 0.06; scene.add(walk);
const chars = RIDES.map((r, i) => {
  const c = createCharacter(randomLook());
  c.root.position.set((i - (RIDES.length - 1) / 2) * 1.3, 0, 0);
  c.root.rotation.y = q.get('view') === 'front' ? 0 : Math.PI / 2; // facing +x: seen from the side
  c.setBike(1, r);
  scene.add(c.root);
  return c;
});
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
if (q.has('only')) { camera.position.set(0, 0.9, 3.2); camera.lookAt(0, 0.45, 0); } else { camera.position.set(0, 1.4, 9); camera.lookAt(0, 0.6, 0); }
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const tick = (dt) => { chars.forEach((c) => c.animate(dt, speed)); renderer.render(scene, camera); };
if (q.has('manual')) window.__step = (s) => { for (let k = 0; k < Math.round(s * 60); k++) tick(1 / 60); };
else { const t = new THREE.Timer(); renderer.setAnimationLoop(() => { t.update(); tick(t.getDelta()); }); }
</script></body></html>
