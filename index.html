<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe3ff" />
    <meta name="description" content="Walk the streets of Seongsu-dong, Seoul, in 3D, right in your browser." />
    <title>Metaverse Korea</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <!-- HUD -->
    <div id="hud" hidden>
      <div class="street-card" id="street-card">
        <div class="street-label" data-i18n="hud.youAreOn"></div>
        <div class="street-name" id="street-name"></div>
        <div class="street-sub" id="street-sub"></div>
        <button class="chip" id="street-translate" data-i18n="hud.translate"></button>
        <div class="zone-line" id="zone-line" hidden></div>
      </div>
      <div class="top-right">
        <span class="online" id="weather" hidden></span>
        <span class="online" id="online" hidden></span>
        <button class="online coin-chip" id="coin-btn">🪙 <b id="coin-count">0</b></button>
        <button class="chip icon-chip" id="settings-btn" aria-label="Settings">⚙️</button>
      </div>
      <div class="tools">
        <button class="tool" id="map-btn"><span>🗺️</span><small data-i18n="hud.map"></small></button>
        <button class="tool" id="bike-btn"><span>🚲</span><small id="bike-label" data-i18n="hud.bike"></small></button>
        <button class="tool" id="chat-btn"><span>💬</span><small data-i18n="hud.chat"></small></button>
        <button class="tool" id="cart-btn"><span>🛍️</span><small data-i18n="hud.cart"></small><b class="badge" id="cart-count" hidden>0</b></button>
      </div>
      <div class="guide" id="guide" hidden>
        <svg class="guide-arrow" id="guide-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="currentColor"/></svg>
        <span id="guide-text"></span>
        <button class="guide-x" id="guide-x" aria-label="Stop guidance">✕</button>
      </div>
      <button class="action" id="action-btn" hidden></button>
      <div class="store-banner" id="store-banner" hidden>
        <div class="store-meta">
          <strong id="store-name"></strong>
          <span id="store-name-ko"></span>
          <small id="store-tagline"></small>
          <span class="sample" data-i18n="shop.sample"></span>
        </div>
        <button class="chip" id="store-exit">🚪 <span data-i18n="shop.exit"></span></button>
      </div>
      <button class="chip decor-btn" id="decor-btn" hidden>🛋️ <span data-i18n="home.decorate"></span></button>
      <div class="decor-bar" id="decor-bar" hidden>
        <p class="fine" data-i18n="home.hint"></p>
        <div class="decor-grid" id="decor-grid"></div>
      </div>
      <div class="piece-bar" id="piece-bar" hidden>
        <strong id="piece-name"></strong>
        <button class="chip" id="piece-rotate">🔄 <span data-i18n="home.rotate"></span></button>
        <button class="chip" id="piece-move">📍 <span data-i18n="home.move"></span></button>
        <button class="chip" id="piece-remove">🗑️ <span data-i18n="home.remove"></span></button>
        <button class="sheet-x" id="piece-close" aria-label="Close">✕</button>
      </div>
      <div class="sheet" id="wallet-panel" hidden>
        <button class="sheet-x" id="wallet-close" aria-label="Close">✕</button>
        <strong class="wallet-title">🪙 <span data-i18n="wallet.title"></span></strong>
        <p class="wallet-balance"><b id="wallet-coins">0</b> <span data-i18n="wallet.coins"></span></p>
        <button class="primary" id="ad-btn">▶️ <span id="ad-label"></span></button>
        <p class="fine" id="ad-left"></p>
        <p class="fine" data-i18n="wallet.note"></p>
      </div>
      <div class="ad-overlay" id="ad-overlay" hidden>
        <div class="ad-box">
          <small data-i18n="wallet.adDemo"></small>
          <strong>🇰🇷 Metaverse Korea</strong>
          <span class="ad-count" id="ad-count">5</span>
          <button class="chip" id="ad-close" data-i18n="wallet.skip"></button>
        </div>
      </div>
      <div class="sheet hat-panel" id="hat-panel" hidden>
        <strong>🧢 <span data-i18n="hat.title"></span></strong>
        <p class="fine" data-i18n="hat.hint"></p>
        <div class="hat-row" id="hat-shapes"></div>
        <div class="hat-row" id="hat-colors"></div>
        <div class="hat-row" id="hat-patches"></div>
        <div class="hat-actions">
          <button class="chip" id="hat-cancel" data-i18n="hat.cancel"></button>
          <button class="primary" id="hat-save" data-i18n="hat.save"></button>
        </div>
      </div>
      <div class="sheet" id="product-panel" hidden>
        <button class="sheet-x" id="product-close" aria-label="Close">✕</button>
        <div class="product-head">
          <span class="product-icon" id="product-icon"></span>
          <div>
            <strong id="product-name"></strong>
            <span id="product-name-ko"></span>
            <b id="product-price"></b>
          </div>
        </div>
        <p id="product-desc"></p>
        <div class="product-actions">
          <button class="chip" id="product-try">🪞 <span data-i18n="shop.tryOn"></span></button>
          <button class="primary" id="product-add">🛍️ <span data-i18n="shop.addToCart"></span></button>
        </div>
        <p class="fine" data-i18n="shop.virtual"></p>
      </div>
      <button class="chip revert" id="revert-look" hidden>↩️ <span data-i18n="shop.revert"></span></button>
      <div class="toast" id="toast" hidden></div>
      <!-- Emotes: one button; press and drag to a petal, or tap to open and tap one. -->
      <div class="emote-wheel" id="emote-wheel">
        <div class="emote-petals" id="emotes" hidden></div>
        <button class="emote-main" id="emote-main" aria-label="Emotes">😊</button>
      </div>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="chat-bar" id="chat-bar" hidden>
        <input id="chat-input" type="text" autocomplete="off" enterkeyhint="send" maxlength="80" data-i18n-placeholder="chat.placeholder" />
        <button class="primary" type="submit" data-i18n="chat.send"></button>
      </form>
      <div class="stamina" id="stamina" hidden aria-hidden="true"><div class="stamina-fill" id="stamina-fill"></div></div>
      <div class="joystick" id="joystick" hidden><div class="knob"></div></div>
      <div class="help" id="help" hidden>
        <span id="help-text"></span>
        <button class="chip" id="help-ok" data-i18n="help.dismiss"></button>
      </div>
    </div>

    <div class="credit">
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"><span data-i18n="credit.map"></span> © OpenStreetMap contributors</a>
      · <a href="https://open-meteo.com/" target="_blank" rel="noopener"><span data-i18n="credit.weather"></span> Open-Meteo</a>
    </div>

    <!-- Start screen -->
    <div class="overlay" id="start">
      <div class="panel" id="step-lang">
        <div class="logo">🏙️</div>
        <h1 data-i18n="app.title"></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
        <h2 data-i18n="lang.choose"></h2>
        <div class="lang-grid" id="lang-grid"></div>
        <p class="region" id="start-region"></p>
        <button class="primary" id="next-btn" data-i18n="start.next"></button>
        <p class="disclaimer" data-i18n="app.disclaimer"></p>
      </div>
      <div class="panel look-panel" id="step-look" hidden>
        <h2 class="look-title" data-i18n="look.title"></h2>
        <div class="look-layout">
          <div class="look-stage">
            <canvas id="look-preview" aria-label="Character preview"></canvas>
            <button class="chip" id="look-random">🎲 <span data-i18n="look.random"></span></button>
          </div>
          <div class="look-options" id="look-options"></div>
        </div>
        <label class="name-field">
          <span data-i18n="start.nickname"></span>
          <input id="nickname" maxlength="16" autocomplete="off" />
        </label>
        <div class="look-actions">
          <button class="chip" id="back-btn" data-i18n="start.back"></button>
          <button class="primary" id="start-btn" data-i18n="start.button"></button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </div>

    <!-- Cart -->
    <div class="overlay dim" id="cart-panel" hidden>
      <div class="panel small cart">
        <button class="sheet-x" id="cart-close" aria-label="Close">✕</button>
        <h2 data-i18n="cart.title"></h2>
        <div id="cart-list"></div>
        <div class="cart-total"><span data-i18n="cart.total"></span><b id="cart-total"></b></div>
        <button class="primary" id="cart-checkout" data-i18n="cart.checkout"></button>
        <p class="fine" id="cart-note" hidden data-i18n="cart.demoNote"></p>
      </div>
    </div>

    <!-- Map -->
    <div class="overlay dim" id="map-panel" hidden>
      <div class="map-card">
        <div class="map-top">
          <h2 data-i18n="map.title"></h2>
          <div class="map-btns">
            <button class="chip map-zoom-out" aria-label="Zoom out">－</button>
            <button class="chip map-zoom-in" aria-label="Zoom in">＋</button>
            <button class="chip map-close" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="map-body">
          <canvas class="map-canvas"></canvas>
          <div class="map-list"></div>
        </div>
        <p class="disclaimer map-disclaimer" data-i18n="app.disclaimer"></p>
      </div>
    </div>

    <!-- Settings -->
    <div class="overlay dim" id="settings-panel" hidden>
      <div class="panel small settings-card">
        <h2 data-i18n="settings.title"></h2>
        <button class="setting-row" id="music-btn" aria-pressed="false">
          <span>🎵</span><span class="setting-label" data-i18n="hud.music"></span><span class="switch"></span>
        </button>
        <button class="setting-row" id="sfx-btn" aria-pressed="true">
          <span>🔔</span><span class="setting-label" data-i18n="settings.sfx"></span><span class="switch"></span>
        </button>
        <button class="setting-row" id="signs-btn" aria-pressed="false">
          <span>🔤</span><span class="setting-label" data-i18n="settings.signs"></span><span class="switch"></span>
        </button>
        <button class="setting-row" id="lang-btn">
          <span>🌐</span><span class="setting-label" data-i18n="lang.change"></span><span class="setting-go">›</span>
        </button>
        <button class="primary" id="settings-close" data-i18n="settings.done"></button>
      </div>
    </div>

    <!-- Language picker (in game) -->
    <div class="overlay" id="lang-overlay" hidden>
      <div class="panel small">
        <h2 data-i18n="lang.choose"></h2>
        <div class="lang-grid" id="lang-grid-2"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
