name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: First-visit download budget
        run: node scripts/check-size.mjs
      - name: Multiplayer end-to-end test
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 3
          node tests/e2e/multiplayer.mjs http://localhost:4173/
          # Memory budget: iPhone Safari closes the page past its canvas limit.
          node tests/e2e/memory.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshot
          path: e2e-multiplayer.png
          if-no-files-found: ignore
