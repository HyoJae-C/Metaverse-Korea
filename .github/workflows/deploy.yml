name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub's deploy step sometimes hangs until its 10-minute timeout and
      # fails, though a normal deploy takes under a minute. Give up after 3
      # minutes and try once more.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
      - id: deployment
        run: echo "page_url=${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}" >> "$GITHUB_OUTPUT"
