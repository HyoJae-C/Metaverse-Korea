name: Fetch OSM map data

# Downloads OpenStreetMap data for a region and commits the generated
# public/regions/<id>/map.json back to the branch.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (folder under public/regions)
        default: seongsu
  push:
    branches-ignore: [main]
    paths:
      - scripts/fetch-osm.mjs
      - scripts/lib/osm-to-map.mjs
      - public/regions/*/region.json
      - .github/workflows/fetch-osm.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and convert
        run: node scripts/fetch-osm.mjs "${{ inputs.region || 'seongsu' }}"
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/regions
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update OSM map data (${{ inputs.region || 'seongsu' }})"
            git push
          fi
