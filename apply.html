<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2ea" />
    <title>무료 전시 신청 · Modu Seoul</title>
    <meta name="description" content="모두서울 무료 전시·팝업 신청. 홍대·연남·을지로 건물 벽, 빈 가게 공간 전시, 성수동 팝업스토어를 무료로 드려요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modu Seoul" />
    <meta property="og:title" content="모든 작가님들 주목! 모두서울 무료 전시 신청" />
    <meta property="og:description" content="웹에서 걷는 서울의 벽, 빈 가게, 성수 팝업 자리를 무료로 드려요. 11/16까지 신청." />
    <meta property="og:url" content="%VITE_SITE_URL%apply.html" />
    <meta property="og:image" content="%VITE_SITE_URL%apply/hero.webp" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f2ea; --card: #fffdf9; --ink: #2a2421; --muted: #786d64; --line: #e6dccd;
        --accent: #e0457b; --accent-ink: #ffffff; --soft: #fde8ef; --ok: #1f8a5b; --bad: #c4372f;
        --display: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        --body: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
      .wrap { max-width: 640px; margin: 0 auto; }
      .top { display: flex; justify-content: space-between; align-items: center; padding-block: 14px; gap: 12px; }
      .top a { color: var(--ink); text-decoration: none; font-weight: 700; }
      .lang { display: flex; gap: 4px; }
      .lang button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer; color: var(--muted); }
      .lang button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
      .hero { border-radius: 16px; overflow: hidden; aspect-ratio: 1080 / 670; max-width: 100%; background: #dfe9f2; }
      .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
      h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 48px); line-height: 1.15; margin: 22px 0 8px; text-wrap: balance; }
      .lead { margin: 0 0 10px; font-size: 17px; }
      .dates { display: inline-block; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 14px; border-radius: 10px; padding: 6px 12px; }
      .play { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 700; }
      form { margin-top: 28px; display: flex; flex-direction: column; gap: 22px; }
      .f { display: flex; flex-direction: column; gap: 6px; }
      .f > label, .f > .lbl { font-weight: 700; }
      .hint { color: var(--muted); font-size: 14px; }
      input[type=text], input[type=email], textarea { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); width: 100%; }
      textarea { min-height: 96px; resize: vertical; }
      input:focus-visible, textarea:focus-visible, button:focus-visible, .opt:focus-within { outline: 3px solid var(--soft); outline-offset: 1px; border-color: var(--accent); }
      .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .opts.one { grid-template-columns: minmax(0, 1fr); }
      .opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; min-width: 0; }
      .opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
      .opt b { display: block; }
      .opt small { color: var(--muted); font-size: 13px; }
      .opt:has(input:checked) { border-color: var(--accent); background: var(--soft); }
      .pick { align-self: flex-start; border: 1px dashed var(--accent); color: var(--accent); background: var(--card); border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
      .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
      .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); max-width: 100%; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb span { position: absolute; inset: auto 0 0 0; font-size: 11px; padding: 2px 6px; background: rgba(0,0,0,.5); color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .thumb button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
      .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
      .consent input { margin-top: 5px; accent-color: var(--accent); flex: none; }
      .note { color: var(--muted); font-size: 14px; margin: 0; }
      .send { border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 800; font-size: 18px; padding: 16px; border-radius: 14px; cursor: pointer; }
      .send:disabled { opacity: .6; cursor: wait; }
      .err { color: var(--bad); font-weight: 700; margin: 0; min-height: 1.6em; }
      .done { text-align: center; padding: 40px 0; }
      .done h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 10px; }
      .done a, .done button { display: inline-block; margin: 8px 6px 0; }
      .done button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; font: inherit; cursor: pointer; }
      @media (max-width: 480px) { .opts { grid-template-columns: minmax(0, 1fr); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <a href="./">Modu Seoul</a>
        <div class="lang"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button></div>
      </div>
      <div class="hero"><img src="./apply/hero.webp" alt="Bukchon hanok alley in Modu Seoul" width="1080" height="670" /></div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <span class="dates" data-t="dates"></span><br />
      <a class="play" href="./" data-t="play"></a>

      <form id="form" novalidate>
        <div class="f"><label for="name" data-t="name"></label><input type="text" id="name" maxlength="60" autocomplete="name" /><span class="hint" data-t="nameHint"></span></div>
        <div class="f"><label for="email" data-t="email"></label><input type="email" id="email" maxlength="120" autocomplete="email" /></div>
        <div class="f"><label for="sns" data-t="sns"></label><input type="text" id="sns" maxlength="120" placeholder="@" /></div>
        <div class="f"><span class="lbl" data-t="kinds"></span><div class="opts" id="kinds"></div></div>
        <div class="f"><span class="lbl" data-t="who"></span><div class="opts" id="who"></div></div>
        <div class="f"><label for="intro" data-t="intro"></label><textarea id="intro" maxlength="1500"></textarea></div>
        <div class="f">
          <span class="lbl" data-t="images"></span>
          <span class="hint" data-t="imagesHint"></span>
          <input type="file" id="files" accept="image/*" multiple hidden />
          <button type="button" class="pick" id="pick" data-t="pick"></button>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="f"><label for="titles" data-t="titles"></label><textarea id="titles" maxlength="1500"></textarea></div>
        <div class="f"><label for="mood" data-t="mood"></label><textarea id="mood" maxlength="1500"></textarea></div>
        <div class="f"><span class="lbl" data-t="christmas"></span><div class="opts one" id="christmas"></div></div>
        <label class="consent"><input type="checkbox" id="consent" /><span data-t="consent"></span></label>
        <p class="note" data-t="note"></p>
        <p class="err" id="err" role="alert"></p>
        <button type="submit" class="send" id="send" data-t="send"></button>
      </form>

      <div class="done" id="done" hidden>
        <h2 data-t="done"></h2>
        <p data-t="doneBody"></p>
        <a href="./" data-t="play"></a>
        <button type="button" id="again" data-t="again"></button>
      </div>
    </div>
    <script type="module" src="/src/apply/apply.js"></script>
  </body>
</html>
